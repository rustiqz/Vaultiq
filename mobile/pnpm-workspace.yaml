# pnpm 11 reads settings other than auth/registry from here, not .npmrc --
# see extension/pnpm-workspace.yaml for the same note re: allowBuilds.
#
# React Native's Gradle/CocoaPods autolinking and Metro's resolver expect a
# flat node_modules with every transitive dependency hoisted to the top
# level, not pnpm's default strict, symlinked layout.
nodeLinker: hoisted

# Security patch for brace-expansion, pulled in transitively by eslint and
# jest tooling whose parents have not bumped it yet. Range-scoped so a major
# version is never forced. Drop once the parents resolve a patched version.
overrides:
  "brace-expansion@1": 1.1.21
  "brace-expansion@5": 5.0.12

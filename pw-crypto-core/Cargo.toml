[package]
name = "pw-crypto-core"
version = "0.45.1"
edition = "2024"
description = "Zero-knowledge crypto core for Vaultiq: key hierarchy and per-item AEAD."
license = "AGPL-3.0-only"
publish = false

# `cdylib` is what wasm-pack needs to emit a .wasm module; `rlib` is kept so
# the crate stays usable as a normal Rust dependency for the Tauri and FFI
# targets in later phases.
[lib]
crate-type = ["cdylib", "rlib"]

# Versions are pinned exactly (`=`) on purpose: this is a security product, so a
# dependency change must be a deliberate, reviewable commit rather than a silent
# resolution. Cargo.lock is committed alongside.
[dependencies]
# KDF: master password -> master key. Argon2id, memory-hard.
argon2 = "=0.5.3"
# AEAD: XChaCha20-Poly1305, 24-byte nonce so random nonces don't collide.
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
# HKDF + SHA-256: domain-separated derivation of auth / stretched keys.
hkdf = "=0.13.0"
sha2 = "=0.11.0"
# HMAC for RFC 6238 one-time passwords. Already in the tree as hkdf's own
# dependency; named here because this crate now calls it directly.
hmac = "=0.13.0"
# SHA-1, for one reason: RFC 6238 defaults to HMAC-SHA1 and nearly every
# issuer's QR code uses it, so a vault that could not compute it would produce
# wrong codes for most real accounts. SHA-1's collision weakness does not
# carry into HMAC, which is what it is used for here — never for signing,
# hashing a password, or authenticating a message we store.
sha1 = { version = "=0.11.0", default-features = false }
# Base32 (RFC 4648) — the encoding every authenticator hands out its shared
# secret in. Decoding only; no dependencies of its own.
data-encoding = { version = "=2.11.1", default-features = false, features = ["alloc"] }
# CSPRNG: OsRng only, for salts, nonces and the vault key.
rand = "=0.10.3"
# Scrubs key material from memory on drop.
zeroize = { version = "=1.9.0", features = ["derive"] }
# Constant-time comparison of secret-derived values.
subtle = "=2.6.1"
# Serialization of encrypted records (never of secret key types).
serde = { version = "=1.0.229", features = ["derive"] }
# Transport encoding for ciphertext/nonce across the WASM and FFI boundaries.
base64 = "=0.23.1"
# Error enum derivation.
thiserror = "=2.0.21"
# Feature-gated: thin JS bindings for the browser extension (phase 2).
wasm-bindgen = { version = "=0.2.127", optional = true }
# Feature-gated: on wasm32-unknown-unknown, getrandom cannot tell from the
# target alone whether JavaScript exists, so `SysRng` has no backend until
# `wasm_js` points it at Crypto.getRandomValues. Without this the crate builds
# for the browser and then fails at runtime the first time it needs a nonce.
getrandom = { version = "=0.4.3", optional = true }
# Feature-gated: moves the already-Serialize records across the JS boundary.
# The alternative is hand-marshalling every field, which is more code and more
# places to get an AAD-bound field wrong.
serde-wasm-bindgen = { version = "=0.6.5", optional = true }
# Feature-gated: thin Kotlin/Swift bindings for native mobile (phase 4). The
# unsafe FFI glue this needs lives inside the `uniffi` crate's own generated
# code, never in ours — see src/ffi.rs.
uniffi = { version = "=0.32.2", optional = true }

# Host-only. proptest pulls rand 0.9 and with it a second, older getrandom
# that needs a RUSTFLAGS cfg on wasm32 — and these tests do not belong in a
# browser anyway: the known-answer vectors are target-independent. Only the
# JS-boundary test in tests/wasm.rs runs in a browser.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "=1.11.0"
serde_json = "=1.0.151"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"
js-sys = "=0.3.104"

[features]
default = []
# getrandom's own docs advise against enabling `wasm_js` in a library, with an
# explicit exception for crates that already depend on wasm-bindgen on wasm
# targets. That is exactly this feature, so we are inside the exception rather
# than working around the advice.
wasm = [
  "dep:wasm-bindgen",
  "dep:serde-wasm-bindgen",
  "dep:getrandom",
  "getrandom/wasm_js",
]
# Native mobile bindings (phase 4): Kotlin on Android today, Swift once iOS
# development is possible again (docs/STATUS.md).
ffi = ["dep:uniffi"]
# Pulls in uniffi's CLI (clap and friends) only for the bindgen binary below,
# so an ordinary `ffi` build stays free of that dependency tree.
uniffi-bindgen = ["ffi", "uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["uniffi-bindgen"]

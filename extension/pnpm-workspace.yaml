# pnpm blocks dependency install scripts until each is explicitly decided, and
# treats an undecided one as fatal in CI. Recording the decisions here keeps
# them in version control rather than in a developer's local pnpm state, so CI
# resolves identically.
#
# pnpm 11 moved this setting out of package.json — the `pnpm` field there is
# no longer read at all.
allowBuilds:
  # Vite needs esbuild's platform binary, which arrives via its install script.
  esbuild: true
  # A Node 0.10 polyfill pulled in by web-ext. Nothing on a modern runtime
  # needs it to run anything at install time.
  spawn-sync: false

# Security patches for transitive dev-tooling dependencies (web-ext, eslint,
# concurrently) that their parents have not bumped yet. Each selector is
# range-scoped so a major version is never forced on a parent that has not
# opted in. Drop an entry once its parent resolves a patched version itself.
overrides:
  "brace-expansion@1": 1.1.21
  "brace-expansion@5": 5.0.12
  "fast-uri@3": 3.1.7
  "tmp@0.2": 0.2.7
  "shell-quote@<1.9.0": 1.9.0
  "adm-zip@0.5": 0.6.1
  "image-size@2": 2.0.3

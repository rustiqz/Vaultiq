name: Security audit

# The scheduled sweep only. Auditing a *change* is a release gate and lives in
# ci.yml, where `needs` can order it ahead of the tag; this workflow exists
# for the case that gate cannot see — an advisory filed against a dependency
# nobody touched, which no diff will ever flag.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ github.run_id }}
          restore-keys: advisory-db-

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - run: cargo audit

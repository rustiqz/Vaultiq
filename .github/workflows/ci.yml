name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are worth cancelling. A push to main is not: it may
  # be midway through tagging a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  gate:
    # The verification gate from CONTRIBUTING.md, enforced rather than trusted.
    # Runs on every PR and again on the merge commit.
    name: fmt · clippy · test · wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      # Built for the browser target, not the host. A host build with the
      # `wasm` feature says nothing about whether this works in a browser —
      # getrandom picks a different backend there, and picking the wrong one
      # fails at runtime rather than at compile time.
      - name: WASM target builds
        run: cargo build --workspace --target wasm32-unknown-unknown --features wasm

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: wasm-pack

      # Run in a real browser, not on the host. The whole reason this layer
      # exists is the browser, and SysRng resolves to a different backend
      # there — a host test cannot tell whether Crypto.getRandomValues is
      # actually reachable.
      # Run from inside the crate rather than passing its path: given a path
      # argument, wasm-pack silently drops the trailing cargo args, and the
      # build then fails for want of the `wasm` feature.
      - name: WASM bindings pass in a browser
        working-directory: pw-crypto-core
        run: wasm-pack test --headless --firefox -- --features wasm

  extension:
    # The browser extension. Runs in parallel with the Rust gate; the wasm
    # package it imports is built from the crate in this same job, so a change
    # to the crypto core that breaks the bindings fails here too.
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: wasm-pack

      # wasm-pack runs wasm-opt on the release build, and when it is not on PATH
      # it downloads an unpinned binaryen from GitHub releases on every run.
      # That download has failed CI twice. Pinned and checksum-verified instead,
      # like gitleaks and actionlint; wasm-pack then finds it on PATH. Version
      # 117 is the one wasm-pack was fetching, so the built artifact is unchanged.
      - name: Install wasm-opt
        env:
          BINARYEN_VERSION: version_117
          BINARYEN_SHA256: 3dc677006555b355ea2da5e82602065a161d5e83eaefd3f759afa00b96e83212
        run: |
          set -euo pipefail
          archive="binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/${archive}"
          echo "${BINARYEN_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" "binaryen-${BINARYEN_VERSION}/bin/wasm-opt"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "binaryen-${BINARYEN_VERSION}/bin/wasm-opt" "$RUNNER_TEMP/bin/wasm-opt"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # The action looks for package.json at the repo root by default,
          # and in this layout the only one lives under extension/.
          package_json_file: extension/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install
        working-directory: extension
        run: pnpm install --frozen-lockfile

      # Must precede typecheck: the wasm package is a source of types, and
      # without it tsc cannot resolve the crypto core at all.
      - name: Build the wasm package
        working-directory: extension
        run: pnpm run wasm

      - name: Typecheck
        working-directory: extension
        run: pnpm run typecheck

      - name: Lint
        working-directory: extension
        run: pnpm run lint

      - name: Test
        working-directory: extension
        run: pnpm run test

      # `bundle` rather than `build`, which would rebuild the wasm package a
      # second time for no gain.
      - name: Bundle
        working-directory: extension
        run: pnpm run bundle

  server:
    # The sync server. Runs in parallel with the Rust gate and the extension.
    name: server · typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: vaultiq
          POSTGRES_DB: vaultiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultiq -d vaultiq"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: server/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: server
        run: pnpm run typecheck

      - name: Lint
        working-directory: server
        run: pnpm run lint

      - name: Build
        working-directory: server
        run: pnpm run build

      - name: Migrations apply, twice
        working-directory: server
        env:
          DATABASE_URL: postgres://vaultiq:test@127.0.0.1:5432/vaultiq
        run: |
          set -euo pipefail
          pnpm run migrate
          # A runner that is not idempotent breaks the second deploy, not the
          # first, so it is run twice here rather than once.
          pnpm run migrate

      - name: Test
        working-directory: server
        env:
          DATABASE_URL: postgres://vaultiq:test@127.0.0.1:5432/vaultiq
        run: pnpm run test

  mobile:
    name: mobile · typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: mobile/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      # devConfig.ts is gitignored (local dev defaults); screens import it, so
      # a fresh checkout needs the committed example in its place.
      - name: Provide dev config
        working-directory: mobile
        run: cp src/devConfig.example.ts src/devConfig.ts

      - name: Typecheck
        working-directory: mobile
        run: pnpm exec tsc --noEmit

      - name: Lint
        working-directory: mobile
        run: pnpm run lint

      - name: Test
        working-directory: mobile
        run: pnpm run test

  server-image:
    name: server · docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build server image
        run: docker build ./server

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" actionlint
          install -m 0755 actionlint "$RUNNER_TEMP/actionlint"

      - name: Lint workflows
        run: |
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

  secrets:
    # Scans the full history, not just the diff: a secret committed and then
    # deleted is still compromised. Test fixtures are
    # allowlisted by file *and* value in .gitleaks.toml. The binary is used
    # rather than gitleaks-action, which needs a licence key for orgs.
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned and checksum-verified: a scanner that fetches whatever is
      # latest is itself an unreviewed supply-chain input.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          install -m 0755 gitleaks "$RUNNER_TEMP/gitleaks"

      - name: Scan history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

  audit:
    # Gates the release, so this job must always run: a *skipped* job in
    # `needs` skips its dependents too, which would silently stop releases
    # altogether. It therefore runs every time and short-circuits inside.
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Did any dependency change?
        id: deps
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # No usable base — a new branch, or a force push. We cannot prove
          # nothing changed, so audit rather than assume.
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No comparable base; auditing."
            exit 0
          fi

          if git diff --name-only "$BEFORE" "$AFTER" | grep -qE '(^|/)Cargo\.(toml|lock)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dependencies changed; auditing."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes. The weekly sweep in audit.yml covers"
            echo "advisories filed against dependencies nobody touched."
          fi

      # Keyed on the run id so every run saves a fresh copy, with a prefix
      # restore so the previous one is always available. cargo-audit updates
      # the database in place, so a warm cache makes that incremental instead
      # of a full clone — which was almost all of the six minutes this took.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.deps.outputs.changed == 'true'
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ github.run_id }}
          restore-keys: advisory-db-

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        if: steps.deps.outputs.changed == 'true'
        with:
          tool: cargo-audit

      - name: Audit
        if: steps.deps.outputs.changed == 'true'
        run: cargo audit

  deny:
    # deny.toml: licences, sources, banned crates, and yanked versions. cargo
    # audit only knows about advisories, so a yanked crate in the lockfile
    # passes it. Runs every time, like audit, so it can gate the release.
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/advisory-dbs
          key: deny-advisory-db-${{ github.run_id }}
          restore-keys: deny-advisory-db-

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Check
        run: cargo deny --locked check

  commit-messages:
    # Version bumps and release notes are derived from commit subjects, so a
    # malformed subject is not a style problem — it silently produces the
    # wrong release. Checked here rather than by a third-party action: this is
    # a security project, and a regex is cheaper to audit than a dependency.
    name: conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+$'
          failed=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            sha="${line%% *}"
            subject="${line#* }"
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::${sha:0:8} subject is not a conventional commit: $subject"
              failed=1
            elif [ "${#subject}" -gt 72 ]; then
              echo "::error::${sha:0:8} subject is ${#subject} chars, limit is 72: $subject"
              failed=1
            fi
          done < <(git log --no-merges --format='%H %s' "$BASE..$HEAD")

          if ! printf '%s' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title is not a conventional commit: $PR_TITLE"
            failed=1
          elif [ "${#PR_TITLE}" -gt 72 ]; then
            echo "::error::PR title is ${#PR_TITLE} chars, limit is 72: $PR_TITLE"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "Expected: <type>(<optional scope>): <subject>"
            echo "Types:    feat fix docs style refactor perf test build ci chore revert"
            echo "Breaking: append ! after the type, or add a BREAKING CHANGE footer"
            exit 1
          fi
          echo "All commit subjects and the PR title are well formed."

  release:
    # Only after `gate` is green, and only for a merge landing on main.
    # `needs` is what guarantees a broken build can never be tagged.
    name: Version and notes
    needs: [gate, extension, server, mobile, server-image, audit, deny, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Consumed by the artifact jobs below. They build from `sha`, the version
    # commit, rather than from a tag: the tag is only created by `publish`,
    # once every artifact exists.
    outputs:
      released: ${{ steps.push.outputs.released }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.0

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: git-cliff

      - name: Work out whether there is anything to release
        id: check
        run: |
          set -euo pipefail

          # Two merges landing close together start two of these. Both check
          # out their own merge commit, both build a version commit, and the
          # slower one is then rejected when it pushes — main has moved. The
          # concurrency group does not prevent this: it serialises the jobs,
          # not the branch.
          #
          # Being overtaken is not a failure. git-cliff computes from the last
          # tag, so the newer run's release will contain this run's commits
          # too. Stand aside rather than racing it.
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main has moved past $GITHUB_SHA; the newer run releases this."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          next=$(git cliff --bumped-version)

          echo "current=${current:-<none>}"
          echo "next=$next"

          # git-cliff returns the current tag unchanged when nothing since it
          # is releasable — every commit was chore/style, or there were none.
          if [ -n "$current" ] && [ "$current" = "$next" ]; then
            echo "Nothing releasable since $current."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$next" >> "$GITHUB_OUTPUT"
          fi

      # Before the tag, deliberately: the tagged tree has to state the truth
      # about what it contains. Tagging first and bumping after would leave
      # every tag pointing at stale component versions.
      - name: Set component versions
        if: steps.check.outputs.release == 'true'
        run: |
          set -euo pipefail
          scripts/component-versions.sh --write

          # Refreshes only the workspace members' own entries; external pins
          # are untouched.
          cargo update --workspace

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pw-crypto-core/Cargo.toml Cargo.lock extension/package.json \
            server/package.json mobile/package.json mobile/android/app/build.gradle

          if git diff --staged --quiet; then
            echo "Component versions already current."
          else
            # `chore:` is a type cliff.toml skips, so this commit cannot
            # trigger a release of its own; [skip ci] stops it burning a run.
            git commit -m "chore(release): set component versions [skip ci]"
          fi

      - name: Build release notes
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          git cliff --unreleased --tag "$VERSION" --strip header --output RELEASE_NOTES.md
          {
            echo ""
            echo "### Components"
            echo ""
            echo "The product version moves on any change; a component's moves"
            echo "only when its own shipped artifact does."
            echo ""
            scripts/component-versions.sh
          } >> RELEASE_NOTES.md

      - name: Push the version commit
        id: push
        if: steps.check.outputs.release == 'true'
        run: |
          set -euo pipefail

          # Checked again: main could have moved while the versions were being
          # written. Cheaper to stand aside than to push and be rejected.
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main moved while this run was working; leaving it to the newer run."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only the commit is pushed here. The tag and the GitHub release are
          # created by `publish`, after every artifact has been built from this
          # exact commit, so a release is never visible with assets missing.
          # If an artifact job fails, main carries a version commit with no tag;
          # the next run computes from the last tag, so nothing is lost.
          git push origin HEAD:main
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Keep the release notes
        if: steps.push.outputs.released == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  extension-release:
    # Rebuilt from the version commit, not reused from the `extension` job:
    # that one built the merge commit, before the component versions were
    # written, so its manifest would state the previous version. The toolchain
    # steps repeat the `extension` job's and must be kept in step with it.
    name: Package extension
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: wasm-pack

      - name: Install wasm-opt
        env:
          BINARYEN_VERSION: version_117
          BINARYEN_SHA256: 3dc677006555b355ea2da5e82602065a161d5e83eaefd3f759afa00b96e83212
        run: |
          set -euo pipefail
          archive="binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/${archive}"
          echo "${BINARYEN_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" "binaryen-${BINARYEN_VERSION}/bin/wasm-opt"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "binaryen-${BINARYEN_VERSION}/bin/wasm-opt" "$RUNNER_TEMP/bin/wasm-opt"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: extension/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: extension
        run: pnpm run build

      - name: Zip
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p assets
          # The manifest sits at the archive root, which both stores and
          # `web-ext` expect. -X drops timestamps/uid noise from the entries.
          (cd extension/dist && zip -X -r -9 "$GITHUB_WORKSPACE/assets/vaultiq-extension-${VERSION#v}.zip" .)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-extension
          path: assets/*
          if-no-files-found: error

  server-release:
    # Pushes the version tag only. `latest` moves in `promote-latest`, after
    # the release exists, so it never points at a release that failed to
    # publish. Built from the version commit for the same reason as the
    # extension: the server reports its own version at boot.
    name: Push server image
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image
        id: image
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # GHCR rejects uppercase in repository names.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/vaultiq-server" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          # Links the package to this repository on GHCR.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release.outputs.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
            org.opencontainers.image.licenses=AGPL-3.0-only

  android-release:
    # The only job that touches the signing key. `environment: release` is what
    # makes the secrets readable, and that environment is restricted to `main`,
    # so a PR or a fork can never reach them. Built from the version commit so
    # versionName/versionCode (written by component-versions.sh) are the
    # release's own.
    name: Build signed APK
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-ndk

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships an Android SDK but not necessarily the NDK the
      # project pins (android/build.gradle `ndkVersion`), so install it.
      - name: Install Android NDK
        run: |
          set -euo pipefail
          # Not `yes | sdkmanager`: under pipefail, `yes` dies of SIGPIPE when
          # sdkmanager stops reading and fails the whole pipeline.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < <(yes) >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: mobile/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Provide dev config
        working-directory: mobile
        run: cp src/devConfig.example.ts src/devConfig.ts

      # Cross-compiles pw-crypto-core and generates the Kotlin bindings; neither
      # output is committed.
      - name: Build the crypto core for Android
        working-directory: mobile
        run: pnpm run crypto

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Secrets arrive through env, never interpolated into the script text.
      # Backslashes are doubled because the file is read as a Java properties
      # file, where a single one is an escape.
      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=$keystore"
            echo "storePassword=$(esc "$STORE_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "keyPassword=$(esc "$KEY_PASSWORD")"
          } > mobile/android/keystore.properties

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify the signature
        run: |
          set -euo pipefail
          apk=mobile/android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          # A release signed by the public debug key would install, and be
          # worthless: anyone can sign an "update" with it.
          if grep -qi "Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::APK is signed with the debug key."
            exit 1
          fi

      - name: Name the asset
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p assets
          cp mobile/android/app/build/outputs/apk/release/app-release.apk \
            "assets/vaultiq-${VERSION#v}.apk"

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" mobile/android/keystore.properties

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-android
          path: assets/*
          if-no-files-found: error

  publish:
    # The only job that creates the tag and the release. It runs only if every
    # artifact job succeeded; a skipped or failed one in `needs` stops it.
    name: Publish release
    needs: [release, extension-release, server-release, android-release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asset-*
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: Checksums
        working-directory: assets
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Add install notes
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo ""
            echo "### Install"
            echo ""
            echo "Server image (linux/amd64, linux/arm64):"
            echo ""
            echo '```'
            echo "docker pull ghcr.io/${owner}/vaultiq-server:${VERSION#v}"
            echo '```'
            echo ""
            echo "Android: \`vaultiq-${VERSION#v}.apk\` (arm64-v8a), signed with the Vaultiq release key."
            echo ""
            echo "Firefox: \`vaultiq-extension-${VERSION#v}.xpi\` (signed by Mozilla, unlisted) is attached a few minutes after the release."
            echo ""
            echo "Verify downloads against \`SHA256SUMS\`."
          } >> notes/RELEASE_NOTES.md

      - name: Tag and publish
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA: ${{ needs.release.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # No checkout here, hence GH_REPO. The tag is created by this call,
          # at the exact commit the artifacts were built from.
          gh release create "$VERSION" assets/* \
            --target "$SHA" \
            --title "$VERSION" \
            --notes-file notes/RELEASE_NOTES.md

  extension-sign:
    # Firefox only installs signed extensions permanently. This submits the
    # extension to AMO's unlisted channel (automated review, no store listing)
    # and attaches the signed .xpi to the release. It runs after `publish`, not
    # before: an AMO outage or rejection must not hold back the server image
    # and the APK, and a failure here leaves a complete release without the
    # .xpi. The zip that shipped is what gets signed, not a rebuild. When the
    # extension version is unchanged since an earlier release, that release's
    # signed .xpi is attached again instead of asking AMO to sign it twice.
    name: Sign extension
    needs: [release, extension-release, publish]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: extension/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asset-extension
          path: shipped

      - name: Sign
        env:
          VERSION: ${{ needs.release.outputs.version }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p unpacked signed
          unzip -q "shipped/vaultiq-extension-${VERSION#v}.zip" -d unpacked
          out="signed/vaultiq-extension-${VERSION#v}.xpi"
          extver=$(jq -er .version unpacked/manifest.json)

          # The extension's own version only moves when the extension changes
          # (see CLAUDE.md 8.3), so a server-only or core-unrelated release
          # ships an extension identical to the last one. AMO refuses to sign
          # a version it already has ("Version X already exists"), and that
          # release would be left without an .xpi and without updates.json.
          # So first look for an earlier release that carries this extension
          # version, and reuse its signed .xpi byte for byte.
          reused=""
          for tag in $(gh release list --limit 30 --json tagName --jq '.[].tagName'); do
            [ "$tag" = "$VERSION" ] && continue
            rm -rf prev && mkdir prev
            gh release download "$tag" --pattern 'vaultiq-extension-*.xpi' --dir prev 2>/dev/null || continue
            prev=$(ls prev/*.xpi)
            if [ "$(unzip -p "$prev" manifest.json | jq -r .version)" = "$extver" ]; then
              cp "$prev" "$out"
              reused="$tag"
              break
            fi
          done

          if [ -n "$reused" ]; then
            echo "extension $extver is unchanged; reusing the signed .xpi from $reused"
          else
            # `--approval-timeout` is how long to wait for AMO's automated
            # review before giving up; the default is 15 minutes.
            (cd extension && pnpm exec web-ext sign \
              --source-dir ../unpacked \
              --artifacts-dir ../signed \
              --channel unlisted \
              --approval-timeout 1500000)
            mv "$(ls signed/*.xpi)" "$out"
          fi

          # The manifest's update_url points at this file on the latest
          # release. It is built from the signed .xpi, so the hash it
          # advertises is the hash of what Firefox will download.
          scripts/update-manifest.sh unpacked/manifest.json "$out" "$VERSION" \
            > signed/updates.json

      - name: Attach to the release
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          xpi="signed/vaultiq-extension-${VERSION#v}.xpi"
          # SHA256SUMS was written by `publish`; extend it rather than leave the
          # .xpi as the one asset it does not cover.
          gh release download "$VERSION" --pattern SHA256SUMS --dir signed
          (cd signed && sha256sum "vaultiq-extension-${VERSION#v}.xpi" >> SHA256SUMS && cat SHA256SUMS)
          gh release upload "$VERSION" "$xpi" signed/updates.json signed/SHA256SUMS --clobber

  promote-latest:
    # Runs only once the release is public, so `latest` never gets ahead of it.
    name: Move latest tag
    needs: [release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vaultiq-server"
          # Copies the manifest list; no rebuild, so :latest is the same digest.
          docker buildx imagetools create --tag "${image}:latest" "${image}:${VERSION#v}"

# Standalone deployment from the published image. Copy this file and a .env
# to the target machine; no source checkout is needed.
#
#   POSTGRES_PASSWORD=...   (openssl rand -base64 32)
#   VAULTIQ_DOMAIN=vault.example.com
#   VAULTIQ_VERSION=0.53.0  (a release number, or `latest`; the only line you change to upgrade)
#
# Upgrade:  edit VAULTIQ_VERSION, then
#   docker compose pull && docker compose down && docker compose up -d
#
# `down` keeps the named volumes (database, certificates). Never add `-v`.
# Only Caddy is published; Postgres and the server are internal-only.

name: vaultiq

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaultiq
      POSTGRES_USER: vaultiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultiq -d vaultiq"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  server:
    image: ghcr.io/rustiqz/vaultiq-server:${VAULTIQ_VERSION:?set VAULTIQ_VERSION in .env}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://vaultiq:${POSTGRES_PASSWORD}@db:5432/vaultiq
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      VAULTIQ_DOMAIN: ${VAULTIQ_DOMAIN:?set VAULTIQ_DOMAIN in .env}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [server]
    networks: [internal]

# Same as the repo's Caddyfile, inlined so this is one file.
configs:
  caddyfile:
    content: |
      {$$VAULTIQ_DOMAIN} {
        encode zstd gzip
        header {
          -Server
        }
        reverse_proxy server:3000
      }

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  internal:
